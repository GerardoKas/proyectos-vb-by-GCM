<HTML><HEAD><TITLE>Diario 000</TITLE>
<script>
function AddItem(){
var objNew=null
var objAdded=null
  objNew=itemClone.cloneNode(true)
  objNew.id="itemNew"
  objNew.innerHTML="<span contentEditable=false>Dia: <b>" + GetData() + "<b></span><hr width=50% align=left>"
  objAdded=Contenido.appendChild(objNew)
  objAdded.style.display='block'
}
function GetData(){
var sDate=new Date()
return (sDate.toLocaleString())
}
</script>
<style>
.ITEM{
display:block;margin:6px;border:1 solid green;background-color:#223344;width:90%;color:ivory
}
</style>
